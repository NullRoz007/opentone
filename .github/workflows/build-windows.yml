name: Build and release (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x  # keep in step with <TargetFramework> in the project

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
              throw "Tag '$tag' is not a version such as v1.2.3 or v1.2.3-beta.1"
            }
            $version = $Matches[1]
          } else {
            $version = '0.0.0-dev.' + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Check libusb
        shell: pwsh
        run: |
          $path = 'lib/libusb-1.0.dll'
          if (-not (Test-Path $path)) { throw "$path not found" }
          # Read the PE header: the DLL must be x64 to match the win-x64 build
          $bytes = [IO.File]::ReadAllBytes($path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x8664) { throw ('libusb-1.0.dll is not x64 (machine 0x{0:X4})' -f $machine) }

      - name: Publish
        run: >
          dotnet publish -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Package
        shell: pwsh
        run: |
          $name = "opentone-${{ steps.version.outputs.version }}-win-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null

          Copy-Item publish/* $dir
          Copy-Item lib/libusb-1.0.dll $dir
          foreach ($f in 'README.md', 'LICENSE', 'LICENSE.md') {
            if (Test-Path $f) { Copy-Item $f $dir }
          }
          # libusb's own license text, if it is kept in lib/
          $lic = Get-ChildItem lib -File | Where-Object { $_.Name -match '^(COPYING|LICENSE)' } | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$dir/libusb-$($lic.Name)" }

          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"

          # LF line ending so `sha256sum -c` works on the file
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/SHA256SUMS.txt", "$hash  $name.zip`n")

      - uses: actions/upload-artifact@v7
        with:
          name: opentone-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: opentone-win-x64
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          name: OpenTone ${{ github.ref_name }}
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Windows x64 build of OpenTone. Unzip it and run the executable from a terminal. `libusb-1.0.dll` must stay in the same folder.

            The amp must be bound to a libusb-compatible driver such as WinUSB (see the README).

            **Flashing firmware writes to the amp's internal flash and cannot be undone. An interrupted update may leave the amp unusable. Use at your own risk.**

            Check the download against `SHA256SUMS.txt`.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt