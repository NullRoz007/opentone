name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only needed to attach the zip to a release on tag pushes

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x   # keep in step with <TargetFramework> in the project

      - name: Check libusb
        shell: pwsh
        run: |
          $path = 'lib/libusb-1.0.dll'
          if (-not (Test-Path $path)) { throw "$path not found" }
          # Read the PE header: the DLL must be x64 to match the win-x64 build
          $bytes = [IO.File]::ReadAllBytes($path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x8664) { throw ('libusb-1.0.dll is not x64 (machine 0x{0:X4})' -f $machine) }

      - name: Publish
        run: >
          dotnet publish -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Add libusb
        shell: pwsh
        run: Copy-Item lib/libusb-1.0.dll publish/

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath opentone-win-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: opentone-win-x64
          path: publish/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: opentone-win-x64.zip